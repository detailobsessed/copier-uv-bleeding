# Lychee link checker configuration
# https://github.com/lycheeverse/lychee

# Exclude placeholder and example URLs in templates
exclude = [
    '^https://example\.com',
    '^https://pypi\.org/project/\{\{',
    '^https://codecov\.io/gh/\{\{',
    '^https://img\.shields\.io',
    '^mailto:',
    # Upstream copier-pdm site is dead — historical CHANGELOG reference
    '^https://copier-pdm\.github\.io/',
]

# Exclude local/private addresses
exclude_all_private = true

# Don't check mail addresses
include_mail = false

# Accept common status codes
accept = [200, 204, 301, 302, 403, 429]

# Timeout per request
timeout = 30

# Max concurrent requests
max_concurrency = 16

# Don't show progress bar (cleaner CI output)
no_progress = true
