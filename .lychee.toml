# Lychee link checker configuration
# https://github.com/lycheeverse/lychee

# Don't check the config file itself (regex patterns get parsed as URLs)
exclude_path = [".lychee.toml", "project/docs/"]

# Exclude placeholder and example URLs in templates
exclude = [
    '^https://example\.com',
    '^https://pypi\.org/project/\{\{',
    '^https://codecov\.io/gh/\{\{',
    '^https://img\.shields\.io',
    '^mailto:',
    # Upstream copier-pdm site is dead — historical CHANGELOG reference
    '^https://copier-pdm\.github\.io/',
    # Placeholder URLs in issue templates
    '^https://github\.com/username/',
    # Discussions link may 404 if not enabled
    'discussions/new\?category=',
    # PyPI package URL with Jinja placeholder renders as bare /p/
    '^https://pypi\.org/p/$',
    # Localhost URLs (e.g. docs preview in CONTRIBUTING.md)
    '^http://localhost',
    # Copier template: CONTRIBUTING.md.jinja doesn't exist as plain .md in the template repo
    '^file://.*CONTRIBUTING\.md',
    # GitHub Pages site may not be deployed yet
    '^https://detailobsessed\.github\.io/',
]

# Exclude local/private addresses
exclude_all_private = true

# Don't check mail addresses
include_mail = false

# Accept common status codes
# 502: GitHub commit/release URLs transiently return Bad Gateway
accept = [200, 204, 301, 302, 403, 429, 502]

# Timeout per request
timeout = 30

# Max concurrent requests
max_concurrency = 16
