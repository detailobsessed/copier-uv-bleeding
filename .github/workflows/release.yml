name: release

# Manual only. Releasing after every green CI run on main cut one release per
# merged PR, so merging a stack bottom-up shipped its intermediate states as
# releases. Run it once the merges are done: `poe release`.
"on":
  workflow_dispatch:

permissions:
  contents: write
  actions: read  # the CI gate below lists runs; unlisted scopes are none

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency: release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        fetch-depth: 0
        fetch-tags: true

    # The workflow_run trigger used to guarantee this; a manual run has to check.
    - name: Require green CI on main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # The release commit is pushed with GITHUB_TOKEN, which triggers no CI.
        # It is also the tagged commit, and with nothing after it there is
        # nothing to release; semantic-release below says so.
        if tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
          echo "main is at release $tag, nothing new to gate"
          exit 0
        fi
        sha=$(git rev-parse HEAD)
        conclusion=$(gh run list --workflow ci --branch main --commit "$sha" --event push \
          --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
        if [ "$conclusion" != "success" ]; then
          echo "::error::CI on main@$sha is '$conclusion', not 'success'. Wait for it or fix main first."
          exit 1
        fi

    - name: Setup uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.15"
        enable-cache: true
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: uv sync --group dev

    - name: Semantic Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        uv run semantic-release --strict version --changelog --push --tag --vcs-release
        exit_code=$?
        set -e
        if [ $exit_code -eq 0 ]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
          tag=$(git describe --tags --abbrev=0)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        elif [ $exit_code -eq 2 ]; then
          echo "No release needed"
          echo "released=false" >> "$GITHUB_OUTPUT"
        else
          echo "Semantic release failed with exit code $exit_code"
          exit $exit_code
        fi
