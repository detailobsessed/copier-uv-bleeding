name: ci

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LANG: "en_US.utf-8"
  LC_ALL: "en_US.utf-8"
  PYTHONIOENCODING: "UTF-8"
  PYTHON_VERSIONS: ""

jobs:

  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          src:
            - 'project/**'
            - 'tests/**'
            - 'scripts/**'
            - 'copier.yml'
            - 'extensions.py'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'docs/**'
            - '*.md'

  links:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Check links
      uses: lycheeverse/lychee-action@v2
      with:
        fail: true
        args: --config .lychee.toml --no-progress .

  test-filenames:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Test file names
      run: bash tests/test_filenames.sh

  test-funding:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Configure Git
      run: |
        git config --global init.defaultBranch main
        git config --global user.email "dev@ichoosetoaccept.com"
        git config --global user.name "I Choose to Accept"
    - name: Setup uv and Python
      uses: astral-sh/setup-uv@v7.1.5
      with:
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: project/pyproject.toml.jinja
    - name: Install Copier
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      run: uv tool install copier --with copier-templates-extensions
    - name: Test FUNDING.yml generation
      run: bash tests/test_funding.sh

  test-licenses:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Configure Git
      run: |
        git config --global init.defaultBranch main
        git config --global user.email "dev@ichoosetoaccept.com"
        git config --global user.name "I Choose to Accept"
    - name: Setup uv and Python
      uses: astral-sh/setup-uv@v7.1.5
      with:
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: project/pyproject.toml.jinja
    - name: Test licenses
      run: uv run --with jinja2 --with pyyaml --with reuse python tests/test_licenses.py

  test-project:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    strategy:
      matrix:
        python-version:
        - "3.14"

    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Configure Git
      run: |
        git config --global init.defaultBranch main
        git config --global user.email "dev@ichoosetoaccept.com"
        git config --global user.name "I Choose to Accept"

    - name: Setup uv and Python
      uses: astral-sh/setup-uv@v7.1.5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: project/pyproject.toml.jinja

    - name: Install Copier
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      run: uv tool install copier --with copier-templates-extensions

    - name: Test project generation and workflow
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      run: uv run pytest tests/test_template.py -v --cov=tests --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
