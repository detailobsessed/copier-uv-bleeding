name: ci

"on":
  push:
    branches:
      - main
  # Deliberately unfiltered. Gating on `branches: [main]` meant stacked PRs --
  # which target their parent branch, not main -- never triggered CI at all,
  # so every PR in a stack but the bottom one was reviewed with no signal.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LANG: "en_US.utf-8"
  LC_ALL: "en_US.utf-8"
  PYTHONIOENCODING: "UTF-8"
  PYTHON_VERSIONS: ""

jobs:

  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: filter
      with:
        filters: |
          src:
            - 'project/**'
            - 'tests/**'
            - 'scripts/**'
            - 'copier.yml'
            - 'extensions.py'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'docs/**'
            - '*.md'

  links:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check links
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        fail: true
        token: ${{ secrets.GITHUB_TOKEN }}
        args: --config .lychee.toml --no-progress .

  prek:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.14"
        enable-cache: true
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Refresh lockfile
      run: uv lock
    - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
      env:
        SKIP: pytest-cov,lychee,uv-lock
      with:
        extra-args: '--all-files'

  test-project:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Configure Git
      run: |
        git config --global init.defaultBranch main
        git config --global user.email "dev@detailobsessed.com"
        git config --global user.name "I Choose to Accept"

    - name: Setup uv and Python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: project/pyproject.toml.jinja
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Copier
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      run: uv tool install copier --with copier-template-extensions

    - name: Test file names
      run: bash tests/test_filenames.sh

    - name: Test licenses
      run: uv run --with jinja2 --with pyyaml --with reuse python tests/test_licenses.py

    - name: Test project generation and workflow
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      run: uv run pytest tests/test_template.py tests/test_template_lint.py -v --cov=tests --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  ci-pass:
    if: always()
    needs: [links, prek, test-project]
    runs-on: ubuntu-latest
    steps:
    - name: Check all jobs passed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
      with:
        allowed-skips: test-project
        allowed-failures: links
        jobs: ${{ toJSON(needs) }}
