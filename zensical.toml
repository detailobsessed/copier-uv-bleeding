[project]
site_name = "Copier UV Bleeding"
site_description = "Copier template for Python projects managed by uv (bleeding edge fork)"
site_url = "https://detailobsessed.github.io/copier-uv-bleeding"
repo_url = "https://github.com/detailobsessed/copier-uv-bleeding"
repo_name = "detailobsessed/copier-uv-bleeding"
extra_css = ["css/custom.css"]

nav = [
  {"Home" = [
    {"Overview" = "index.md"},
    {"Contributing" = "contributing.md"},
    {"Code of Conduct" = "code_of_conduct.md"},
    {"Changelog" = "changelog.md"},
    {"License" = "license.md"},
  ]},
  {"Usage" = [
    {"Requirements" = "requirements.md"},
    {"Generating a project" = "generate.md"},
    {"Working on a project" = "work.md"},
    {"Updating a project" = "update.md"},
  ]},
]

[project.theme]
logo = "logo.svg"
favicon = "logo.svg"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
[project.theme.palette.toggle]
icon = "material/brightness-auto"
name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "purple"
[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "lime"
[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Switch to system preference"

# Since we add non-default extensions (callouts, magiclink), we must list all.
[project.markdown_extensions.admonition]
[project.markdown_extensions.callouts]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.snippets]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
[project.markdown_extensions.toc]
permalink = "¤"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/detailobsessed/copier-uv-bleeding"
