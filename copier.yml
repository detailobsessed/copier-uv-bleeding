# CONFIGURATION -------------------------
_min_copier_version: "9.13"
_envops:
  autoescape: false
  keep_trailing_newline: true
_subdirectory: project
_templates_suffix: .jinja
_preserve_symlinks: true
# No `_jinja_extensions`: a stock `uv tool install copier` must be enough to
# copy and update. Copier always loads jinja2-ansible-filters, which provides
# the `regex_replace` (slugs below) and `strftime` (LICENSE year) used here.
# Until 0.42.1 the template loaded extensions.py, and every update aborted on
# a copier installed without copier-template-extensions (DOT-674).
# Files to skip on update: hand-edited (README/CHANGELOG/source) OR generated (uv.lock).
#
# pyproject.toml and prek.toml are deliberately NOT here. Copier's own update
# replays the project's edits onto the new render, and with `--conflict inline`
# (what `poe update-template` passes) a file it cannot patch cleanly gets a real
# 3-way `git merge-file`, so only lines both sides changed are marked. From 0.41.0
# to 0.41.14 both files sat here and a task regenerated them on every update,
# keeping only marked regions: every other customisation was lost (DOT-620,
# DOT-630). tests/test_update_preserves_project.py is the guard. See docs/update.md.
#
# No `_migrations`: the template does not carry code for projects on older
# releases. An update that skips one shows up in `git status`, and the
# `no-copier-rej-files` and `check-merge-conflict` hooks block the commit until
# it is resolved. docs/update.md lists what to fix by hand.
#
# uv.lock is regenerated by `uv sync` from pyproject.toml; the template ships one for
# its own dev env but it must never land in a user project — a stale lockfile clobbers
# the working one and trips uv on the next sync.
#
# Globs, not `{{ python_package_import_name }}`: that answer is computed
# (`when: false`), and on update the pattern did not match, so copier replayed the
# project's edits to its own `__init__.py` and wrote them to a `.rej` (DOT-630). The
# template ships one file under each glob, and a project's own test files matching
# `tests/test_*.py` are never rendered by the template, so skipping them is a no-op.
_skip_if_exists:
- CHANGELOG.md
- README.md
- "src/*/__init__.py"
- "tests/__init__.py"
- "tests/test_*.py"
- uv.lock

_exclude:
- "{% if repository_provider != 'github.com' %}.github{% endif %}"
- "{% if repository_provider != 'gitlab.com' %}.gitlab-ci.yml{% endif %}"
- "{% if not use_semantic_release %}.github/workflows/release.yml{% endif %}"
- "{% if not publish_to_mcp_registry %}.github/workflows/mcp-registry-publish.yml{% endif %}"
- "{% if not use_blacksmith_runners %}.github/actionlint.yaml{% endif %}"
# Open-source scaffolding (LICENSE + community-health files) — gated on open_source.
# The LICENSE line falls back to the question default so that a cross-version
# `copier update` (where older answers predate open_source) keeps LICENSE and the
# pyproject `license-files` glob in sync.
- "{% if not (open_source | default(repository_provider == 'github.com')) %}LICENSE{% endif %}"
- "{% if not open_source %}CODE_OF_CONDUCT.md{% endif %}"
- "{% if not open_source %}CONTRIBUTING.md{% endif %}"
- "{% if not open_source %}SECURITY.md{% endif %}"
- "{% if not open_source %}.github/FUNDING.yml{% endif %}"
- "{% if not open_source %}.github/ISSUE_TEMPLATE{% endif %}"
- "{% if not open_source %}.github/pull_request_template.md{% endif %}"

# PROMPT --------------------------------
project_name:
  type: str
  help: Your project name

project_description:
  type: str
  help: Your project description

project_type:
  type: str
  help: What type of project is this?
  default: app
  choices:
    Application (with CLI entry point — uv init --app): app
    Library (importable package, no CLI — uv init --lib): lib

# No template defaults for the author questions: set them once per machine in
# copier's settings.yml (`defaults:`), which copier applies to every template.
# See "Answer defaults per machine" in the README.
author_fullname:
  type: str
  help: Your full name

author_email:
  type: str
  help: Your email

author_username:
  type: str
  help: Your username (e.g. on GitHub)

repository_provider:
  type: str
  help: Your repository hosting platform
  default: github.com
  choices:
  - github.com
  - gitlab.com

repository_host:
  type: str
  help: "Repository hostname (e.g. gitlab.company.com for self-hosted)"
  default: "{{ repository_provider }}"

repository_namespace:
  type: str
  help: Your repository namespace (username or organization)
  default: "{{ author_username }}"

repository_name:
  type: str
  help: Your repository name
  # The slug chain below is repeated in the next three questions; keep all four
  # identical. These answers are `when: false`, so copier never stores them and
  # recomputes them on every update: a changed result renames an existing
  # project's package. tests/test_template_lint.py pins them to the old
  # extensions.py slugify for every ASCII name. Non-ASCII letters are dropped,
  # where slugify transliterated them (é -> e); Jinja has no NFKD.
  # `\\s` is doubled because Jinja unescapes string literals, and a bare `\s`
  # is an invalid escape sequence there.
  default: '{{ project_name | lower | regex_replace("[^a-z0-9_\\s-]", "") | regex_replace("[-_\\s]+", "-") | regex_replace("^[-_]+|[-_]+$", "") }}'
  when: false

open_source:
  type: bool
  help: "Open-source this project? Adds a LICENSE and community-health files (CODE_OF_CONDUCT, CONTRIBUTING, SECURITY, issue/PR templates, FUNDING). Off = internal/private, none of those."
  default: "{{ repository_provider == 'github.com' }}"

copyright_license:
  type: str
  help: Your project's license
  default: ISC
  when: "{{ open_source }}"
  choices:
    Academic Free License v3.0: AFL-3.0
    Apache License 2.0: Apache-2.0
    Artistic License 2.0: Artistic-2.0
    BSD 2-Clause "Simplified" License: BSD-2-Clause
    BSD 3-Clause Clear License: BSD-3-Clause-Clear
    BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
    Boost Software License 1.0: BSL-1.0
    Creative Commons Attribution 4.0 International: CC-BY-4.0
    Creative Commons Attribution Share Alike 4.0 International: CC-BY-SA-4.0
    Creative Commons Zero v1.0 Universal: CC0-1.0
    Do What The F*ck You Want To Public License: WTFPL
    Educational Community License v2.0: ECL-2.0
    Eclipse Public License 1.0: EPL-1.0
    Eclipse Public License 2.0: EPL-2.0
    European Union Public License 1.1: EUPL-1.1
    European Union Public License 1.2: EUPL-1.2
    GNU Affero General Public License v3.0: AGPL-3.0
    GNU General Public License v2.0 only: GPL-2.0
    GNU General Public License v3.0 only: GPL-3.0
    GNU Lesser General Public License v2.1 only: LGPL-2.1
    GNU Lesser General Public License v3.0 only: LGPL-3.0
    ISC License: ISC
    LaTeX Project Public License v1.3c: LPPL-1.3c
    MIT License: MIT
    Mozilla Public License 2.0: MPL-2.0
    Microsoft Public License: MS-PL
    Microsoft Reciprocal License: MS-RL
    University of Illinois/NCSA Open Source License: NCSA
    SIL Open Font License 1.1: OFL-1.1
    Open Software License 3.0: OSL-3.0
    PostgreSQL License: PostgreSQL
    The Unlicense: Unlicense
    zlib License: Zlib

python_package_distribution_name:
  type: str
  help: Your Python package distribution name (for `pip install NAME`)
  default: '{{ project_name | lower | regex_replace("[^a-z0-9_\\s-]", "") | regex_replace("[-_\\s]+", "-") | regex_replace("^[-_]+|[-_]+$", "") }}'
  when: false

python_package_import_name:
  type: str
  help: Your Python package import name (for `import NAME` in Python code)
  default: '{{ project_name | lower | regex_replace("[^a-z0-9_\\s-]", "") | regex_replace("[-_\\s]+", "_") | regex_replace("^[-_]+|[-_]+$", "") }}'
  when: false

python_package_command_line_name:
  type: str
  help: Your CLI name if any (for use in the shell)
  default: '{{ project_name | lower | regex_replace("[^a-z0-9_\\s-]", "") | regex_replace("[-_\\s]+", "-") | regex_replace("^[-_]+|[-_]+$", "") }}'
  when: false

# Questions removed in DOT-676, and what an update does with their old answers,
# are listed in docs/update.md. CI is always on, coverage runs in CI rather than
# as a pre-push hook, and the GitHub repo-settings task always runs where `gh`
# can reach the repo.
#
# `use_ci | default(true)` below maps the removed question's old answer. A
# project made with `use_ci: false` never stored this answer or Blacksmith's
# (both were asked only with CI), so `--defaults` would turn on semantic-release,
# PyPI publishing and Blacksmith runners it never set up. Copier still exposes
# the old answer while it renders that one update, then drops it from
# .copier-answers.yml; a new project has none and gets `true`. Remove once no
# project predating 0.44.0 is left to update.
use_semantic_release:
  type: bool
  help: "Enable semantic-release workflow? (automated versioning, changelog, releases)"
  default: "{{ use_ci | default(true) }}"

publish_to_pypi:
  type: bool
  help: Will you publish this package to PyPI?
  default: "{{ use_semantic_release and open_source }}"
  when: "{{ use_semantic_release }}"

publish_to_mcp_registry:
  type: bool
  help: Will you publish this server to the MCP Registry?
  default: false
  # The registry entry points at the PyPI package.
  when: "{{ publish_to_pypi }}"

# One question where there were two: up to 0.43.0 `use_custom_pypi_index`
# gated this one. Same key, so a stored URL carries over on update.
custom_pypi_index_url:
  type: str
  help: "Package index URL, e.g. Artifactory or Nexus (blank = PyPI)"
  default: ""

use_blacksmith_runners:
  type: bool
  help: Use Blacksmith.sh runners? (2x faster, 75% more cost-efficient than GitHub-hosted)
  default: "{{ repository_provider == 'github.com' and use_ci | default(true) }}"
  when: "{{ repository_provider == 'github.com' }}"


# TASKS --------------------------------
#
# There is deliberately no `chmod +x` task here. It used to be
# `chmod +x scripts/*.sh scripts/*.py`, which flipped the mode of *every* file
# a downstream project keeps in `scripts/` — including its own shebang-less
# ones, which then failed ruff's `EXE002` ("executable but no shebang") with no
# `.rej` and no warning. The obvious recovery (`chmod 644 scripts/*.py`) then
# trips `EXE001` on the legitimately-executable ones (DOT-628).
#
# It was never needed. Copier's own `_render_file` chmods each rendered file to
# the template's mode, preferring the template's *git-index* exec bit over
# `stat().st_mode` so it survives filesystems that don't carry the bit
# (Windows), then syncs the destination's git index to match. That runs on
# `copy` and `update` alike, and only for files copier actually renders — so
# `scripts/check-template-update.sh` (committed 100755) arrives executable,
# and files the template does not own are never touched. Verified against
# copier 9.17.1.
_tasks:
  # Run `uv sync` in copier's temp render dirs (`old_copy`/`new_copy`) AND on
  # initial `copy`, but NOT in the real destination during update. Why this
  # inverted guard (`[ ! -d .git ]`) instead of the more obvious "only sync in
  # destination":
  #
  # On update, copier renders OLD then NEW into two temp dirs, then deletes
  # from the destination anything present in `old_copy` but absent in `new_copy`
  # (see copier's `_remove_old_files`). Old template versions (≤0.34.3) shipped
  # an unguarded `uv sync` in `_tasks`, so `old_copy` ends up with `uv.lock`
  # and a full `.venv/` tree. If the NEW template's sync is guarded out of
  # `new_copy`, the dircmp shows those entries as "removed" and copier wipes
  # them from the user's destination — taking the real `uv.lock` and breaking
  # `.venv` (DOT-587, DOT-588). Running sync in `new_copy` too keeps the trees
  # symmetric so `_remove_old_files` leaves the destination alone.
  #
  # Every release since then syncs in both temp dirs, so the guard has to stay:
  # dropping it would make this release's `new_copy` lack what every older
  # `old_copy` has. The destination is synced by `poe upgrade`, run after the
  # update has been reviewed.
  - "if [ \"{{ _copier_operation }}\" = \"copy\" ] || [ ! -d .git ]; then uv sync --upgrade; fi"
  # Update only — reinstall hooks (fresh copy has no .git yet)
  - command: "if [ -d .git ]; then uv run prek install; fi"
    when: "{{ _copier_operation in ('update', 'recopy') }}"
  # GitHub repo settings — idempotent, runs on copy and update
  - command: "command -v gh >/dev/null && gh repo view --json nameWithOwner -q .nameWithOwner >/dev/null 2>&1 && gh repo edit --delete-branch-on-merge --enable-auto-merge && echo '✓ Enabled delete-branch-on-merge and auto-merge' || true"
    when: "{{ repository_provider == 'github.com' }}"
  # Copy — setup instructions
  - command: "printf '\\n🎉 Project created!\\n\\n  ✓ Dependencies installed\\n\\nTo finish setup:\\n  git init && uv run prek install && uv run prek update\\n  Create your source files in src/ and tests/\\n'"
    when: "{{ _copier_operation == 'copy' }}"
  # Update — confirms what copier itself did and names the next steps. Same .git
  # guard as above: only fire in the destination, never in the temp render dirs.
  - command: "if [ -d .git ]; then printf '\\n🎉 Template updated!\\n\\n  ✓ Git hooks reinstalled\\n\\nNext:\\n  Review git diff and resolve any <<<<<<< markers\\n  poe upgrade  (uv sync --upgrade, prek update)\\n'; fi"
    when: "{{ _copier_operation in ('update', 'recopy') }}"
