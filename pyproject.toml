[project]
name = "copier-uv-bleeding"
version = "0.2.1"
description = "Copier template for Python projects managed by uv (bleeding edge fork)"
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "copier",
    "copier-templates-extensions",
    "jinja2",
    "markdown-callouts",
    "mkdocs",
    "mkdocs-material",
    "poethepoet",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-semantic-release>=10.5.2",
    "pyyaml>=6.0.3",
    "reuse",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
commit_message = "chore(release): {version}"
tag_format = "{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "deps", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.ruff]
target-version = "py314"
line-length = 140

[tool.ruff.lint]
select = [
    "UP",   # pyupgrade rules
    "PT",   # pytest best practices
    "S",    # flake8-bandit security rules
    "F",    # Pyflakes (includes unused imports/variables)
    "ARG",  # flake8-unused-arguments
    "C401", # unnecessary-generator-set
    "C402", # unnecessary-generator-dict
    "C403", # unnecessary-list-comprehension-set
    "C404", # unnecessary-list-comprehension-dict
    "C405", # unnecessary-literal-set
    "F632", # is-literal
    "W605", # invalid-escape-sequence
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S701"]  # Allow assert, subprocess, jinja2 in tests

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.poe.tasks]
# Setup
setup = "uv sync"

# Quality
format = "ruff format ."
lint = "ruff check ."
fix = ["lint --fix", "format"]

# Testing
test = "pytest tests/ -v -m 'not slow'"
test-all = "pytest tests/ -v"
test-cov = "pytest tests/ -v --cov=tests --cov-report=term-missing"

# Documentation
docs = "mkdocs serve"
docs-build = "mkdocs build -s"
docs-deploy = "mkdocs gh-deploy"

# Pre-commit
prek = "prek run --all-files"

# GitHub utilities
releases = "gh release list --limit 10"
tags = "sh -c 'git fetch --tags && git tag --sort=-version:refname'"
runs = "gh run list --limit 10"
watch = "gh run watch"
