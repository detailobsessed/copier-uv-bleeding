[project]
name = "copier-uv-bleeding"
version = "0.27.11"
description = "Copier template for Python projects managed by uv (bleeding edge fork)"
readme = "README.md"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "copier",
    "copier-templates-extensions",
    "jinja2",
    "markdown-callouts",
    "mkdocs",
    "mkdocs-material",
    "poethepoet",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=3.16",
    "pytest-xdist>=3.5",
    "python-semantic-release>=10.5.2",
    "pyyaml>=6.0.3",
    "reuse",
    "ruff",
    "ty>=0.0.14",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
commit_message = "chore(release): {version}"
tag_format = "{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
mode = "update"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "deps", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.ruff]
target-version = "py314"
line-length = 140
preview = true

[tool.ruff.lint]
select = [
    # Core (ruff defaults)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes

    # Modern Python
    "UP",   # pyupgrade - use modern Python syntax
    "I",    # isort - import sorting

    # Code quality
    "A",    # flake8-builtins - prevent shadowing builtins (id, type, list, etc.)
    "B",    # flake8-bugbear - common bugs and design issues
    "SIM",  # flake8-simplify - simplify code
    "C4",   # flake8-comprehensions - better comprehensions
    "PIE",  # flake8-pie - misc improvements
    "RET",  # flake8-return - return statement issues
    "RSE",  # flake8-raise - raise best practices
    "RUF",  # Ruff-specific rules
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat - catch missing commas
    "ICN",  # flake8-import-conventions
    "TID",  # flake8-tidy-imports - absolute imports
    "TC",   # flake8-type-checking - TYPE_CHECKING imports
    "PTH",  # flake8-use-pathlib - prefer pathlib over os.path
    "FURB", # refurb - modernize and simplify code
    "FLY",  # flynt - prefer f-strings over .format() and %

    # Naming
    # "N",  # pep8-naming - PEP 8 naming conventions (enable when ready)

    # Datetime
    "DTZ",  # flake8-datetimez - enforce timezone-aware datetimes

    # Error messages
    "EM",   # flake8-errmsg - no string literals in exceptions

    # Pylint
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLR",  # pylint refactor (too-many-args, too-many-branches, etc.)
    "PLW",  # pylint warnings

    # Performance
    "PERF", # Perflint - performance anti-patterns

    # Security
    "S",    # flake8-bandit - security issues

    # Testing
    "PT",   # flake8-pytest-style

    # Error handling
    "TRY",  # tryceratops - exception handling
    "LOG",  # flake8-logging - logging best practices

    # Unused code
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate - commented-out code

    # Print statements (use logging instead)
    "T20",  # flake8-print
]

[tool.ruff.lint.isort]
known-first-party = ["tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S404", "S603", "S607", "S701",  # Allow assert, subprocess, jinja2 in tests
    "T201",       # Allow print in tests
    "PLR6301",    # Test methods don't use self (pytest classes)
    "PLR2004",    # Magic values in assertions are fine
    "PLC0415",    # Lazy imports in test functions are idiomatic
    "PLC2701",    # Private name imports for testing internals
    "ARG002",     # Unused method arguments (fixtures)
    "DTZ005",     # Naive datetime in tests is fine
    "PLR0904",    # Test classes naturally have many test methods
]
"extensions.py" = ["S404", "S602", "S605", "S607"]  # Template extensions use subprocess for git commands
"scripts/**" = ["T201"]  # CLI scripts need print

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.poe.tasks]
# Setup
setup = "uv sync"

# Quality
format = "ruff format ."
lint = "ruff check ."
typecheck = "ty check ."
check.parallel = ["lint", "typecheck"]
check.ignore_fail = "return_non_zero"
fix = ["lint --fix", "format"]

# Testing
test = "pytest tests/ -v -m 'not slow'"
test-fast = "pytest tests/ -v -m 'not slow' -n auto --dist loadscope"
test-all = "pytest tests/ -v"
test-cov = "pytest tests/ -v --cov=tests --cov-report=term-missing"

# Documentation
docs = "mkdocs serve"
docs-build = "mkdocs build -s"
docs-deploy = "mkdocs gh-deploy"

# Linting
lint-templates = "python scripts/lint_templates.py"

# Pre-commit
prek = "prek run --all-files"

# GitHub utilities
# actions-up: https://github.com/azat-io/actions-up
actionsup = "actions-up"
releases = "gh release list --limit 10"
tags = "sh -c 'git fetch --tags && git tag --sort=-version:refname'"
runs = "gh run list --limit 10"
checks = "gh pr checks --watch"
watch = "gh run watch"

[tool.ty.environment]
python-version = "3.14"
python = ".venv"

[tool.coverage.run]
branch = true
parallel = true
source = ["tests/"]

[tool.coverage.report]
precision = 2
omit = ["tests/__init__.py"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.json]
output = "htmlcov/coverage.json"
