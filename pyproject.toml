[project]
name = "copier-uv-bleeding"
version = "0.42.1"
description = "Bleeding edge Copier template for Python projects managed by uv"
readme = "README.md"
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "copier>=9.19.1",
    "jinja2",
    "markdown-callouts",
    "zensical",
    "poethepoet",
    "hypothesis>=6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=5",
    "pytest-xdist>=3.5",
    # Not just for running hooks: tests/test_template.py shells out to
    # `prek util list-builtins` to check the template's builtin ids are real.
    # Without it as a dependency that test silently skips in CI.
    "prek>=0.5.7",
    "python-semantic-release>=10.7",
    "pyyaml>=6.0.3",
    "reuse",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    # Copier loads it into every render; tests/test_template_lint.py does too,
    # so the template's `regex_replace` and `strftime` render there as in copier.
    "jinja2-ansible-filters",
    # The template itself no longer needs it (DOT-674). tests/test_update_preserves_project.py
    # copies at 0.41.14 and updates from there, and copier renders that old
    # version with its own `_jinja_extensions`. Drop once BASELINE_TAG is past 0.42.1.
    "copier-template-extensions>=0.3.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
# `set -e` is required: python-semantic-release runs build_command as a shell
# script, not an `&&` chain, so without it a failing `uv lock` is swallowed
# and the release reports success having committed a stale lockfile (DOT-602).
#
# The `unset` lines are required because bare build_command_env entries are
# resolved as os.getenv(name, "") and assigned unconditionally, so a variable
# unset in CI arrives as an empty string rather than being omitted. uv parses
# its UV_* variables as typed CLI values (enum, path, boolish), so an empty
# one is malformed rather than absent and `uv lock` exits 2 (DOT-615).
build_command = """
set -e
[ -n "$UV_SYSTEM_CERTS" ] || unset UV_SYSTEM_CERTS
[ -n "$UV_CACHE_DIR" ] || unset UV_CACHE_DIR
[ -n "$UV_LINK_MODE" ] || unset UV_LINK_MODE
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock CHANGELOG.md
"""
# python-semantic-release REPLACES rather than extends the environment for
# build_command, so `uv lock` above would otherwise run with no TLS, proxy or
# cache configuration. Bare entries are pass-through via os.getenv(name, "");
# unset variables arrive as empty strings, so any new UV_* entry here also
# needs an `unset` guard in build_command above (DOT-605, DOT-615).
build_command_env = [
    "UV_SYSTEM_CERTS",
    "UV_CACHE_DIR",
    "UV_LINK_MODE",
    "SSL_CERT_FILE",
    "SSL_CERT_DIR",
    "REQUESTS_CA_BUNDLE",
    "HTTP_PROXY",
    "HTTPS_PROXY",
    "NO_PROXY",
    "http_proxy",
    "https_proxy",
    "no_proxy",
]
commit_message = "chore(release): {version}"
tag_format = "{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "deps", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
# Aggressive patch releases: template users get improvements via `copier update` only
# when a release exists. Scale back to ["fix", "perf"] once the template stabilises.
patch_tags = ["fix", "perf", "refactor", "ci", "docs", "chore", "style", "build", "deps"]

[tool.ruff]
target-version = "py315"
line-length = 140
# `extend-select` below assumes ruff 0.17's broad defaults (407 rules), and
# `py315` is only stable from 0.17. On 0.14 and 0.15 the defaults are just 59
# rules (E4/E7/E9/F), so extending them would silently drop the prefixes deleted
# here as redundant — FA, FLY, PIE.
required-version = ">=0.17"
# Preview rules are unstable by definition — they change behaviour and can be
# removed between patch releases. Turning them on also opts into preview-only
# config syntax that then cannot be turned off again: `rule-codes-in-selectors`
# (RUF201) demands rule NAMES in ignore selectors, but names are themselves
# rejected outside preview ("Selecting rules by name requires preview mode"),
# and `noqa-comments` demands `# ruff: ignore[...]`, which stable ruff does not
# honour as a suppression at all. Rule codes and `# noqa:` work in both modes,
# so they are the portable choice. Stable ruff 0.17 already enables 407 rules.
preview = false

[tool.ruff.lint]
# `extend-select`, not `select`. Ruff's default rule set is broad (407 rules
# as of 0.17) and changes with each release. `select` REPLACES that set, so a
# curated list silently switches off every default it omits — this list was
# disabling 81 of them, including all ten flake8-async rules, blind-except,
# the leftover-debugger check and the flake8-pyi rules, with nothing warning
# that it was doing so. `extend-select` layers on top of the defaults instead,
# so rules ruff adds arrive on their own. Rules it removes still vanish
# silently (0.17 dropped seven DTZ rules), so diff the default set on upgrade.
#
# Only list a prefix here if it is NOT already on by default. Entries that
# become default should be deleted rather than kept "for documentation": a
# redundant entry is indistinguishable from a load-bearing one.
extend-select = [
    # Core — pycodestyle beyond the default subset
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes

    # Modern Python — enforce current idioms
    "UP",   # pyupgrade — use modern syntax (match, type unions, etc.)
    "I",    # isort — deterministic import ordering

    # Code quality — catch bugs and enforce clean patterns
    "A",    # flake8-builtins — prevent shadowing builtins (id, type, list)
    "B",    # flake8-bugbear — common bugs and design issues
    "SIM",  # flake8-simplify — simplifiable constructs
    "C4",   # flake8-comprehensions — better comprehensions
    "RET",  # flake8-return — consistent return statements
    "RSE",  # flake8-raise — raise best practices
    "ISC",  # flake8-implicit-str-concat — catch missing commas in collections
    "RUF",  # Ruff-specific rules
    "FURB", # refurb — modernise and simplify code
    "PGH",  # pygrep-hooks — catch bare `# type: ignore`, eval(), etc.

    # Import hygiene
    "ICN",  # flake8-import-conventions — enforce standard aliases (np, pd)
    "TID",  # flake8-tidy-imports — ban relative imports, enforce absolute
    "TC",   # flake8-type-checking — move imports behind TYPE_CHECKING

    # Naming — currently disabled; enable once existing code conforms
    # "N",  # pep8-naming — PEP 8 naming conventions

    # Correctness
    "PTH",  # flake8-use-pathlib — prefer pathlib over os.path
    "DTZ",  # flake8-datetimez — naive datetimes; ruff 0.17 dropped 7 of 10 from its defaults

    # Error messages
    "EM",   # flake8-errmsg — variables in exception constructors (better tracebacks)

    # Complexity
    "C9",   # mccabe — cyclomatic complexity (max-complexity = 10)

    # Pylint — uses default thresholds; do not inflate to hide violations
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLR",  # pylint refactor (too-many-args, too-many-branches, etc.)
    "PLW",  # pylint warnings

    # Performance
    "PERF", # Perflint — performance anti-patterns

    # Security
    "S",    # flake8-bandit — security issues

    # Testing
    "PT",   # flake8-pytest-style — consistent pytest idioms

    # Error handling
    "TRY",  # tryceratops — exception handling best practices
    "LOG",  # flake8-logging — logging best practices

    # Housekeeping
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate — commented-out code
    "T20",  # flake8-print — use logging instead of print()
]
ignore = [
    "TRY003",  # Overly strict — forces custom exception classes for every error message
]

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S603", "S607", "S701",  # Allow assert, subprocess, jinja2 in tests
    "T201",       # Allow print in tests
    "PLR2004",    # Magic values in assertions are fine
    "PLC0415",    # Lazy imports in test functions are idiomatic
    "ARG002",     # Unused method arguments (fixtures)
    "DTZ005",     # Naive datetime in tests is fine
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.poe.tasks]
# Setup
setup = "uv sync"

# Quality
format = "ruff format ."
lint = "ruff check ."
typecheck = "ty check ."
check.parallel = ["lint", "typecheck"]
check.ignore_fail = "return_non_zero"
fix = ["lint --fix", "format"]

# Testing
test = "pytest tests/ -v -m 'not slow'"
test-fast = "pytest tests/ -v -m 'not slow' -n auto --dist loadscope"
test-all = "pytest tests/ -v"
test-cov = "pytest tests/ -v --cov=tests --cov-report=term-missing"

# Documentation
docs = "zensical serve"
docs-build = "zensical build -s --clean"

# Pre-commit
prek = "prek run --all-files"

# GitHub utilities
# actions-up: https://github.com/azat-io/actions-up
actionsup = "actions-up"
releases = "gh release list --limit 10"
tags = "sh -c 'git fetch --tags && git tag --sort=-version:refname'"
runs = "gh run list --limit 10"
checks = "gh pr checks --watch"
watch = "gh run watch"

# Releases are manual (see release.yml). Lists what origin/main would ship, then
# dispatches the workflow and follows the run; semantic-release in the run
# decides the version and skips the release if no commit warrants one.
[tool.poe.tasks.release]
help = "Release origin/main via the release workflow and follow the run"
verbosity = -1  # don't echo the script itself
shell = """
set -e
git fetch --quiet --tags origin main
last=$(git describe --tags --abbrev=0 origin/main)
pending=$(git log --oneline --no-merges "$last"..origin/main)
if [ -z "$pending" ]; then
  echo "Nothing on origin/main since $last."
  exit 0
fi
printf 'Unreleased on origin/main since %s:\\n%s\\n\\n' "$last" "$pending"
since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
out=$(gh workflow run release --ref main)
echo "$out"
run_id=$(printf '%s\\n' "$out" | sed -n 's|.*/actions/runs/\\([0-9][0-9]*\\).*|\\1|p' | head -n 1)
# gh prints the run URL only when GitHub answers 200 with run details; it can
# still answer 204, so fall back to the newest dispatch run created since.
tries=0
while [ -z "$run_id" ] && [ "$tries" -lt 10 ]; do
  sleep 3
  tries=$((tries + 1))
  run_id=$(gh run list --workflow release --event workflow_dispatch --limit 1 \\
    --json databaseId,createdAt --jq ".[] | select(.createdAt >= \\"$since\\") | .databaseId")
done
if [ -z "$run_id" ]; then
  echo "Dispatched, but found no release run created since $since. Check: poe runs" >&2
  exit 1
fi
gh run watch "$run_id" --exit-status
"""

[tool.ty.environment]
python-version = "3.15"
python = ".venv"

[tool.coverage.run]
branch = true
parallel = true
source = ["tests/"]

[tool.coverage.report]
# CI's "Test template" step runs with --cov, so this gate is enforced there.
fail_under = 90
precision = 2
omit = ["tests/__init__.py"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.json]
output = "htmlcov/coverage.json"
